{% extends "base.html" %}
{% block title %}Error Interno - DuckSound{% endblock %}
{% block content %}
<div class="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center">
    <div class="empty-icon" style="font-size:80px;color:var(--accent);margin-bottom:24px">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="empty-title" style="font-size:32px;margin-bottom:12px">500 - Error del Servidor</h1>
    <p class="empty-text" style="max-width:400px;margin-bottom:32px;font-size:16px">
        Algo salió mal en nuestro lado. Estamos trabajando para solucionarlo lo antes posible.
    </p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-accent">
        <i class="fa-solid fa-rotate-right"></i> Reintentar
    </a>
</div>
{% endblock %}
