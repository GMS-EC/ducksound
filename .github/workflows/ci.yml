name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///:memory:
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Check syntax
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile app/models.py
          python -m py_compile app/__init__.py
          python -m py_compile app/routes/admin.py
          python -m py_compile app/routes/api.py
          python -m py_compile app/routes/audio.py
          python -m py_compile app/routes/auth.py
          python -m py_compile app/routes/main.py
          python -m py_compile app/services/audio_analyzer.py
          python -m py_compile app/services/lyrics.py
          python -m py_compile app/services/metadata.py
          python -m py_compile app/services/queue.py
          python -m py_compile app/services/recommender.py
          python -m py_compile app/services/scanner.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ducksound:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
