name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg
          pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Check syntax
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile models.py
          python -m py_compile scan_songs.py
          python -m py_compile metadata_normalizer.py
          python -m py_compile metadata_fetcher.py
          python -m py_compile recommender.py
          python -m py_compile lyrics_fetcher.py
          python -m py_compile musicbrainz_client.py
          python -m py_compile task_queue.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ducksound:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
