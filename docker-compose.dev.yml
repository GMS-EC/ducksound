# Archivo de Docker Compose para DESARROLLO con Hot Reloading (Vite en :5173)
# Uso: docker compose -f docker-compose.dev.yml up
services:
  web:
    build: .
    container_name: ducksound_dev_backend
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${MUSIC_PATH}
        target: /music
        read_only: true
      - ducksound_data:/data
      - ./app:/app/app
      - ./config.py:/app/config.py
    environment:
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN:-ducksound_admin_token}
      - SECRET_KEY=${SECRET_KEY:-}
      - PORT=8604
    ports:
      - '8604:8604'

  frontend:
    image: node:20-alpine
    container_name: ducksound_dev_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:8604
      - VITE_API_PROXY_TARGET=http://web:8604
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

volumes:
  ducksound_data:
    driver: local
