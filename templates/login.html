{% extends "base_auth.html" %}

{% block title %}Login - DuckSound{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="DuckSound" style="height:40px;vertical-align:middle;margin-right:10px">DuckSound</h1>
            <p class="auth-subtitle">Inicia sesión para continuar</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="nombre_usuario" class="form-label">Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" class="form-input" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar Sesión</button>
        </form>
        
        <div class="auth-footer">
            <p class="auth-info"><i class="fa-regular fa-envelope" style="margin-right:6px"></i>Contacta al administrador para crear una cuenta</p>
        </div>
    </div>
</div>
{% endblock %}
