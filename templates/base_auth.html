<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DuckSound{% endblock %}</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
    
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.auth-page::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(217, 88, 64, 0.06), transparent 60%),
                radial-gradient(700px 420px at 100% 10%, rgba(61, 122, 108, 0.04), transparent 60%),
                var(--bg);
            pointer-events: none;
            z-index: 0;
        }

        main.auth-only {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .sidebar,
        .right-panel,
        #mini-player-parent {
            display: none !important;
        }

        .main-wrapper {
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body class="auth-page">
    <!-- Solo contenido de autenticación -->
    <main class="auth-only">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
