services:
  ducksound:
    build: .
    container_name: ducksound
    restart: unless-stopped
    volumes:
      - ${MUSIC_PATH}:/music:ro
      - ducksound_data:/data
    environment:
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN:-ducksound_admin_token}
      - SECRET_KEY=${SECRET_KEY:-}
      - PORT=8604
      - WEB_WORKERS=2
      - WEB_THREADS=2
      - LOG_LEVEL=info
    ports:
      - '8604:8604'

volumes:
  ducksound_data:
    driver: local
